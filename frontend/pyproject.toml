[project]
name = "usb-sentinel-display"
version = "0.1.0"
description = "Frontend that shows USB Sentinel inspection results on a 3.5-inch touch display (tkinter)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # QR matrix generation for the on-screen codes. Only get_matrix() is used, so Pillow ([pil]) is not installed.
    "qrcode>=8.0",
]

[project.scripts]
usb-sentinel-display = "usb_sentinel_display.libs:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty==0.0.87",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# usb_sentinel_display/ sits directly under frontend/ instead of using a src/ layout.
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "S",    # flake8-bandit
    "DTZ",  # flake8-datetimez
    "ANN",  # flake8-annotations (replaces mypy strict's disallow_untyped_defs)
]
ignore = [
    # subprocess calls are centralised in units.py and argv is always a fixed list.
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# Tests and development scripts may use assert and hard-coded values.
"tests/*" = ["S101", "S105", "S106", "DTZ001"]
"scripts/*" = ["S101"]

[tool.ty.rules]
# Enable rules that are off by default to get close to mypy strict.
# Detect decorators that lose the function type (like mypy's disallow_untyped_decorators).
dynamic-function-decorator-return = "error"
# Detect generics without type arguments (like mypy's disallow_any_generics).
missing-type-argument = "error"
# Warn about references to variables that may be undefined on some branches.
possibly-unresolved-reference = "warn"
# Detect a return of a value that is not a subtype of the declared return type.
unsound-return-statement = "error"
# Warn about `# ty: ignore` comments that are no longer needed (like mypy's warn_unused_ignores).
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gui: smoke tests that need tk.Tk()"]
