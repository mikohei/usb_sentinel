# Example configuration for usb_sentinel.
#
# Install to: /etc/usb-sentinel/config.toml
# Keys left out fall back to the defaults in backend/usb_sentinel/libs/config.py.
# The tool also runs with defaults when this file does not exist.

# Root directory for results. One <timestamp>-<serial>/ directory is created under
# it, holding result.json / result.txt / result-qr.png / hash-inventory.tsv.
results_dir = "/var/lib/usb-sentinel/results"

# Root of the temporary directories used for read-only mounts.
mount_root = "/run/usb-sentinel/mnt"

# Ceiling for the destructive capacity and speed checks. true means this host MAY
# erase; false means it never does (the steps are SKIPPED and the display's mode
# button is locked). Even with true, a drive is erased only when it was inserted
# while the display showed "Scan + erase" (the operator entered the on-screen code)
# and /etc/usb-sentinel/docker.env has USB_SENTINEL_DEVICE_ACCESS=rw; run-docker.sh
# then passes --mode full with the device read-write. Drives inserted in scan-only
# mode keep their data. The steps are reached only after the ClamAV scan and the
# hash inventory have finished. Keep false when samples are returned to their owner.
# This example keeps the safe value; scripts/install-docker.sh sets true (and
# USB_SENTINEL_DEVICE_ACCESS=rw) unless it runs with INSTALL_ALLOW_ERASE=0.
allow_destructive = false

# After the capacity and speed checks ran, format the whole drive as exFAT so it can
# be used and inspected again (fio writes to the start of the drive and leaves no
# filesystem). Never done when those checks did not run: a drive with malware, a
# failed scan, or scan-only mode is left exactly as it was inserted.
reformat = true

# Whether to build the file hash inventory (hash-inventory.tsv).
# Used to compare hashes outside the isolated station.
# Once ClamAV has actually scanned, the inventory is built whatever the scan result
# was. The time limit is hash_inventory_timeout_s.
hash_inventory = true

# Time limit in seconds for building the inventory. The inventory is built whatever
# the ClamAV result (detection, error or timeout).
hash_inventory_timeout_s = 3600.0

# SQLite database that gets one row per inspection. An empty string disables it.
# result.json is the source of truth; the database is only an index.
sqlite_path = "/var/lib/usb-sentinel/db/inspections.sqlite"

# Whether to generate the QR code image of the result summary.
# This is the main way to carry results out across the air gap.
emit_qr = true

[malware]
# Warn in the result when the signature database is older than this many days.
# freshclam cannot run on an isolated station, so the database is expected to be
# staged by hand.
max_db_age_days = 30

# When true, a database older than max_db_age_days makes the step ERROR without
# scanning. The default is to warn only.
stale_db_is_error = false

# Time limit in seconds for scanning the whole drive. Exceeding it is an ERROR
# (never a Pass).
timeout_s = 3600.0

# Regular expressions for paths to skip (passed to clamscan --exclude).
# Empty by default. Excluding paths lowers coverage, so do not add them casually.
exclude_patterns = []

[capacity]
# Pass when actual capacity >= nominal capacity * pass_ratio. Adjust the criterion
# to your operational requirements.
# Too little capacity is Spec Mismatch; enough capacity but lost or corrupted sectors
# reported by f3read is Defective.
pass_ratio = 0.93

# Nominal capacity from the product page, in bytes, using decimal units exactly as
# advertised (32 GB -> 32000000000).
# When set, both the reported and the measured capacity are compared with it: below
# 93% is a capacity shortfall, above 107% is suspected counterfeit.
# When unset, only the 93% check against the reported capacity (lsblk) applies.
# Do not confuse it with GiB notation (32 GiB = 34359738368).
# nominal_bytes = 32000000000
over_ratio = 1.07

# When true, use f3probe only (fast, destructive, writes to the device directly).
# When false, format the whole drive as exFAT and verify all of it with f3write +
# f3read. Large drives take long: about capacity / speed for each of the two.
use_probe = false

# f3write mode: run f3probe first; "Bad news" ends the step as counterfeit within
# minutes instead of after the full write.
probe_first = true

# Time limit in seconds for the whole step. 0 means no limit: the step then ends
# early only on a clear failure (below), so 2 TB and 8 TB drives are checked to the
# end. A positive value is a hard limit; exceeding it is an ERROR (never a Pass).
timeout_s = 0.0

# f3write and f3read run batch_files 1 GB files at a time, with checks between
# batches: a write or read I/O error ends the step as Defective, and corruption
# found while files remain ends the read-back.
batch_files = 8

# Writes slower than the speed step's threshold ([speed] nominal_write_mb_s or the
# device_class minimum, times pass_ratio) for this many batches in a row end the
# step as Spec Mismatch.
slow_batches = 3

# A batch that cannot finish at this rate (MB/s) is stopped as stalled (Spec
# Mismatch).
stall_mb_s = 1.0

[speed]
# Parameters for the fio sequential read followed by sequential write. These are
# provisional values and must be calibrated against existing tools such as
# CrystalDiskMark.
block_size = "1M"
queue_depth = 8
duration_s = 30

# Pass when the measured value is at least this ratio of the nominal speed.
# Provisional value.
pass_ratio = 0.80

# Time limit in seconds for the two fio runs combined. Exceeding it is an ERROR.
timeout_s = 900.0

# Manufacturer's nominal speeds (MB/s, 10^6 bytes per second). Only the side that is
# set is judged; the other side is recorded only.
# When neither is set, the speed step is SKIPPED and the overall verdict is
# Inconclusive.
# nominal_read_mb_s = 90.0
# nominal_write_mb_s = 20.0

# Device class. When no nominal speed is set, the industry minimum for this class
# is used for the verdict.
# hdd_5400 / hdd_7200 / sata_ssd / nvme_ssd / sd_c10 / sd_u3 / usb2_flash / usb3_flash
# When unset, usb2_flash or usb3_flash is chosen from the USB link speed (HDDs, SSDs
# and SD cards cannot be told apart, so set it for those).
# device_class = "usb3_flash"
