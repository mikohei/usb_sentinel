# usb-sentinel-displayの設定例。
#
# 配置先: ~/.config/usb-sentinel/display.toml（`--config`で差し替え可）
# 記載しなかったキーはfrontend/usb_sentinel_display/libs/config.pyの既定値が使われる。
# ファイル自体が無い場合も既定値で動作する。
# 未知のキーや型の違う値があると起動時に設定エラーで止まる（設定ミスを隠さない）。

# backendが結果を書き出すルート。配下の<timestamp>-<serial>/result.jsonだけを読む。
# 無くても起動し、情報ストリップに「結果ディレクトリが見つからない」を出して毎秒再試行する。
# 読めないときは「結果ディレクトリを読む権限がない」になる（README「ディスプレイの設置」手順7）。
results_dir = "/var/lib/usb-sentinel/results"

# ブロックデバイス一覧を読むsysfsのディレクトリ。開発機では`--sys-block`で偽ツリーに差し替える。
sys_block = "/sys/block"

# 検査ユニット名の雛形。{kernel}にsda〜sddなどのカーネル名が入る。{kernel}が無いと起動しない。
unit_template = "usb-sentinel-docker@{kernel}.service"

# 画面を更新する周期（秒）。0.2〜10の範囲。
poll_interval_s = 1.0

# USBを抜いた後も判定とQRを表示し続ける時間（分）。1以上の整数。
# 同じポートに次のUSBを挿した時点でも消える。
retain_minutes = 60

# 日本語フォント。無ければ標準エラーに警告を出してTkの既定フォントで描く。
# Ubuntuでは`sudo apt-get install -y fonts-noto-cjk`で入る。
font_family = "Noto Sans CJK JP"
# 起動時の画面の言語。"en"か"ja"。画面の言語ボタン（左下中央）かキーLで切り替えると
# $XDG_STATE_HOME/usb-sentinel-display/language（無ければ~/.local/state/…）に記録され、
# 次回からは記録のほうが優先される。
language = "en"

# backendのSQLite索引。読み取り専用（mode=ro、PRAGMA query_only）で開き、DBには書かない。
# result.jsonが正本でDBは索引。候補の一覧とstate='started'（検査中）の行だけに使う。
# 無い・開けない・スキーマ版が新しいときは自動で結果ディレクトリの走査にフォールバックし、
# 情報ストリップに理由を出す。空文字""で無効化し、走査だけにする（開発機向け）。
sqlite_path = "/var/lib/usb-sentinel/db/inspections.sqlite"

# 物理ポートとsysfsのポートパスの対応表。ファイル中の出現順にタイル1〜4へ入る。
# 個体ごとにcalibrateで実測して埋める。既定は空で全ポートがP?表示になる。
# 1つの物理ポートでもUSB 2.0とUSB 3.0でパスが変わるので、両方を列挙する。
# labelは1〜4文字の印字可能ASCII。labelの重複、別エントリ間のpathsの重複、5件以上は起動エラー。
#
# [[ports]]
# label = "P1"
# paths = ["1-1.1", "2-1"]
#
# [[ports]]
# label = "P2"
# paths = ["1-1.2", "2-2"]
#
# [[ports]]
# label = "P3"
# paths = ["1-1.3"]
#
# [[ports]]
# label = "P4"
# paths = ["1-1.4"]
