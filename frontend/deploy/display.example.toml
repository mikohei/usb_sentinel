# Example configuration for usb-sentinel-display.
#
# Install to: ~/.config/usb-sentinel/display.toml (override with `--config`)
# Keys left out fall back to the defaults in
# frontend/usb_sentinel_display/libs/config.py.
# The app also runs with defaults when this file does not exist.
# An unknown key or a value of the wrong type stops startup with a configuration
# error (mistakes are not hidden).

# Root directory the backend writes results to. Only <timestamp>-<serial>/result.json
# below it is read.
# The app starts without it, shows "results directory not found" in the info strip
# and retries every second.
# When it cannot be read, the strip shows "no permission to read the results
# directory" (see the README, "Display setup", step 7).
results_dir = "/var/lib/usb-sentinel/results"

# sysfs directory that lists the block devices. On a development machine, replace it
# with a fake tree using `--sys-block`.
sys_block = "/sys/block"

# Template for the inspection unit name. {kernel} is replaced by a kernel name such
# as sda to sdd. Startup fails if {kernel} is missing.
unit_template = "usb-sentinel-docker@{kernel}.service"

# Screen refresh interval in seconds. Range 0.2 to 10.
poll_interval_s = 1.0

# Minutes to keep showing the verdict and QR code after a USB stick is removed.
# Integer, 1 or more. It also disappears as soon as the next stick is inserted into
# the same port.
retain_minutes = 60

# Font for Japanese text. If it is missing, a warning goes to standard error and the
# Tk default font is used.
# On Ubuntu: `sudo apt-get install -y fonts-noto-cjk`.
font_family = "Noto Sans CJK JP"

# Language shown at startup: "en" or "ja". When you switch with the language button
# (bottom left, middle) or the L key, the choice is saved to
# $XDG_STATE_HOME/usb-sentinel-display/language (or ~/.local/state/... when unset)
# and the saved choice takes precedence from the next start.
language = "en"

# SQLite index written by the backend. It is opened read-only (mode=ro,
# PRAGMA query_only) and never written to.
# result.json is the source of truth; the database is only an index, used for the
# candidate list and for rows with state='started' (inspection in progress).
# If it is missing, cannot be opened, or has a newer schema, the app falls back to
# scanning the results directory and shows the reason in the info strip.
# An empty string "" disables it so only the scan is used (for development machines).
sqlite_path = "/var/lib/usb-sentinel/db/inspections.sqlite"

# Mapping from physical ports to sysfs port paths. Entries fill tiles 1 to 4 in the
# order they appear in this file.
# Measure each unit with `calibrate` and fill it in. It is empty by default, so
# every port shows as P?.
# One physical port gets a different path for USB 2.0 and USB 3.0 devices, so list
# both.
# label is 1 to 4 printable ASCII characters. Duplicate labels, a path shared by
# several entries, or 5 or more entries are startup errors.
#
# [[ports]]
# label = "P1"
# paths = ["1-1.1", "2-1"]
#
# [[ports]]
# label = "P2"
# paths = ["1-1.2", "2-2"]
#
# [[ports]]
# label = "P3"
# paths = ["1-1.3"]
#
# [[ports]]
# label = "P4"
# paths = ["1-1.4"]
