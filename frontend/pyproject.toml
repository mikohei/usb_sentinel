[project]
name = "usb-sentinel-display"
version = "0.1.0"
description = "USB Sentinelの検査結果を3.5インチタッチディスプレイに表示するフロントエンド（tkinter）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 画面用QRコードの行列生成。get_matrix()だけを使うのでPillow（[pil]）は入れない。
    "qrcode>=8.0",
]

[project.scripts]
usb-sentinel-display = "usb_sentinel_display.libs:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty==0.0.87",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/レイアウトではなくfrontend/直下にusb_sentinel_display/を置いている。
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "S",    # flake8-bandit
    "DTZ",  # flake8-datetimez
    "ANN",  # flake8-annotations（mypy strictのdisallow_untyped_defsの代替）
]
ignore = [
    # subprocessの呼び出しはunits.pyに集約し、argvをリストで固定している。
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# テストと開発用スクリプトではassertと固定値の利用を許容する。
"tests/*" = ["S101", "S105", "S106", "DTZ001"]
"scripts/*" = ["S101"]

[tool.ty.rules]
# mypy strict相当の検査へ近づけるため、既定で無効なルールを有効にする。
# デコレータが関数の型を失う場合を検出する（mypyのdisallow_untyped_decorators相当）。
dynamic-function-decorator-return = "error"
# 型引数のないジェネリクスを検出する（mypyのdisallow_any_generics相当）。
missing-type-argument = "error"
# 条件分岐によって未定義になりうる変数の参照を警告する。
possibly-unresolved-reference = "warn"
# 宣言した戻り値型の部分型でない値を返すreturnを検出する。
unsound-return-statement = "error"
# 不要になった`# ty: ignore`を警告する（mypyのwarn_unused_ignores相当）。
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gui: tk.Tk()を必要とする煙テスト"]
